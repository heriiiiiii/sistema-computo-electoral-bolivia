# =============================================================================
#  haproxy.cfg
#  PostgreSQL Primary Router — postgres-router service
#  Sistema Nacional de Cómputo Electoral Bolivia — Módulo 01
#
#  Provides a STABLE PostgreSQL endpoint that automatically routes to the
#  current writable primary node.
#
#  Ports:
#    5432 (inside Docker)  — backend services connect here
#    5434 (host-mapped)    — connect from host / pgAdmin / test scripts
#    8404 (host-mapped)    — HAProxy stats dashboard (HTTP)
#
#  Failover sequence:
#    1. postgres-primary stops (docker stop postgres-primary)
#    2. HAProxy detects failure: 2 failed checks × 3s interval = ~6s
#    3. HAProxy switches traffic to postgres-replica (backup server)
#    4. postgres-failover-monitor promotes replica in ~15s total
#    5. postgres-replica is now writable — all writes succeed
#    6. Application reconnects automatically (TypeORM auto-reconnect)
#
#  Health check strategy:
#    TCP connection check (option tcp-check).
#    Verifies the server accepts TCP connections on port 5432.
#    Works on both primary and standby — role differentiation is handled
#    by server ordering (primary = active, replica = backup).
#
#    NOTE: HAProxy's pgsql-check is NOT used here because it sends a
#    startup message without a valid database name, which can cause FATAL
#    errors on PostgreSQL 16. TCP check is simpler and equally effective
#    for detecting whether a container is running.
#
#  Primary detection strategy:
#    This config uses the "active + backup" pattern:
#      - postgres-primary is always preferred when reachable
#      - postgres-replica is used ONLY when postgres-primary fails health check
#    Role detection (pg_is_in_recovery) is NOT performed by HAProxy —
#    it is handled by postgres-failover-monitor, which promotes the replica
#    after detecting primary failure.
#
#  Stats dashboard: http://localhost:8404/stats
# =============================================================================

# ── Global settings ───────────────────────────────────────────────────────────

global
    maxconn 200
    log stdout format raw local0 info

# ── Defaults ──────────────────────────────────────────────────────────────────

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    option tcplog
    retries 2

# ── PostgreSQL frontend ───────────────────────────────────────────────────────
# All incoming PostgreSQL connections arrive here.

frontend postgres_frontend
    bind *:5432
    default_backend postgres_backend

# ── PostgreSQL backend ────────────────────────────────────────────────────────
#
# balance first — always use the first available non-backup server.
# server postgres-primary — active (highest priority)
# server postgres-replica — backup (used only when primary fails health check)
#
# Health check: TCP connect every 3 seconds.
# fall 2 — mark DOWN after 2 consecutive failures  (~6 seconds to detect)
# rise 2 — mark UP again after 2 consecutive passes (~6 seconds to recover)

backend postgres_backend
    balance first
    option tcp-check
    server postgres-primary postgres-primary:5432 check inter 3s fall 2 rise 2
    server postgres-replica postgres-replica:5432 check inter 3s fall 2 rise 2 backup

# ── Stats dashboard ───────────────────────────────────────────────────────────
# Real-time HAProxy stats — shows server status, sessions, health checks.
# Access: http://localhost:8404/stats
# Useful during the demo to show live failover detection.

frontend stats
    bind *:8404
    mode http
    no log
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    stats show-desc "OEP PostgreSQL Router — Sistema Nacional de Computo Electoral Bolivia"
