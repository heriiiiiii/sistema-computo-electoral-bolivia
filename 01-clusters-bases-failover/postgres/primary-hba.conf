# pg_hba.conf — PostgreSQL Primary Host-Based Authentication
# Sistema Nacional de Cómputo Electoral Bolivia
#
# TYPE   DATABASE        USER            ADDRESS             METHOD

# Local socket connections (superuser access inside container)
local    all             all                                 trust

# IPv4 local connections
host     all             all             127.0.0.1/32        md5

# IPv6 local connections
host     all             all             ::1/128             md5

# All network connections for application users (Docker network)
host     all             all             0.0.0.0/0           md5

# Streaming replication connections from the replica
# The replicator user is created in 00-create-replication-user.sql
host     replication     replicator      0.0.0.0/0           md5
