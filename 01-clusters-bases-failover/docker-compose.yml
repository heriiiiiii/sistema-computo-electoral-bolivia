version: "3.8"

networks:
  oep-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  postgres_primary_data:
  postgres_replica_data:

services:
  mongo1:
    image: mongo:7
    container_name: mongo1
    hostname: mongo1
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - oep-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "try { db.adminCommand({ping:1}).ok } catch(e) { 0 }"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  mongo2:
    image: mongo:7
    container_name: mongo2
    hostname: mongo2
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    networks:
      - oep-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "try { db.adminCommand({ping:1}).ok } catch(e) { 0 }"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  mongo3:
    image: mongo:7
    container_name: mongo3
    hostname: mongo3
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    networks:
      - oep-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "try { db.adminCommand({ping:1}).ok } catch(e) { 0 }"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  mongo-init:
    image: mongo:7
    container_name: mongo-init
    profiles: [init]
    restart: "no"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    volumes:
      - ./mongo:/scripts
    networks:
      - oep-network
    command: ["mongosh", "--host", "mongo1", "--port", "27017", "/scripts/init-replica.js"]

  postgres-primary:
    image: postgres:16
    container_name: postgres-primary
    hostname: postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: oep_oficial
      POSTGRES_USER: oep_user
      POSTGRES_PASSWORD: oep_password
      TZ: America/La_Paz
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=5
      -c max_replication_slots=5
      -c wal_keep_size=128
      -c hot_standby=on
      -c listen_addresses=*
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c log_replication_commands=on
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/primary-hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "5432:5432"
    networks:
      - oep-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oep_user -d oep_oficial"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  postgres-replica:
    image: postgres:16
    container_name: postgres-replica
    hostname: postgres-replica
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres-primary
      PRIMARY_PORT: "5432"
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator_password
      TZ: America/La_Paz
    entrypoint: ["/bin/bash", "-c", "tr -d '\r' < /replica-setup.sh > /tmp/replica-setup.sh && bash /tmp/replica-setup.sh"]
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./postgres/replica-setup.sh:/replica-setup.sh:ro
      - ./postgres/primary-hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "5433:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - oep-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oep_user -d oep_oficial"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 90s

  postgres-router:
    image: haproxy:2.8
    container_name: postgres-router
    restart: unless-stopped
    volumes:
      - ./postgres/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5434:5432"
      - "8404:8404"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - oep-network
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres-failover-monitor:
    image: node:20-alpine
    container_name: postgres-failover-monitor
    profiles: [monitor]
    restart: unless-stopped
    environment:
      PG_PRIMARY_HOST: postgres-primary
      PG_PRIMARY_PORT: "5432"
      PG_REPLICA_HOST: postgres-replica
      PG_REPLICA_PORT: "5432"
      PG_USER: oep_user
      PG_PASSWORD: oep_password
      PG_DB: oep_oficial
      CHECK_INTERVAL_MS: "5000"
      FAILURE_THRESHOLD: "3"
    volumes:
      - ./scripts:/app
    working_dir: /app
    command: ["sh", "-c", "npm install --production --silent && node postgres-failover-monitor.js"]
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    networks:
      - oep-network