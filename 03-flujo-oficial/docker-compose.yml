# =============================================================================
#  Sistema Nacional de Cómputo Electoral Bolivia
#  Module 01 — Clusters, Databases, Synchronization, and Fault Tolerance
#
#  MongoDB:
#    mongo1 (27017) | mongo2 (27018) | mongo3 (27019) → Replica Set rs0
#
#  PostgreSQL:
#    postgres-primary (5432)
#    postgres-replica (5433)
#    postgres-router / HAProxy (5434)
#
#  First-time startup:
#    1. docker compose up -d mongo1 mongo2 mongo3 postgres-primary
#    2. Wait ~30s for nodes to be healthy
#    3. docker compose --profile init run --rm mongo-init
#    4. docker compose up -d
#
#  Start failover monitor:
#    docker compose --profile monitor up -d postgres-failover-monitor
#
#  Full reset:
#    docker compose down -v
#    docker compose up -d mongo1 mongo2 mongo3 postgres-primary
#    Wait ~30s
#    docker compose --profile init run --rm mongo-init
#    docker compose up -d
# =============================================================================
networks:
  oep-network:
    external: true
    name: 01-clusters-bases-failover_oep-network

services:

  # ── Official Count Backend (NestJS) ─────────────────────────────────────────
  oficial-backend:
    build: ./backend
    container_name: oficial-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://oep_user:oep_password@postgres-router:5432/oep_oficial
      PORT: "4000"
      NODE_ENV: production
      LOGS_DIR: /app/logs
    ports:
      - "4000:4000"
    volumes:
      - ./logs:/app/logs
    networks:
      - oep-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/oficial/resumen || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── CSV Automation (runs once) ───────────────────────────────────────────────
  csv-automation:
    build: ./automation
    container_name: csv-automation
    restart: "no"
    environment:
      BACKEND_URL: http://oficial-backend:4000/api
      CSV_DIR: /app/cvs
      CHUNK_SIZE: "200"
      USUARIO_CARGA: automation
      IP_ORIGEN: automation-container
    volumes:
      - ./cvs:/app/cvs:ro
    networks:
      - oep-network
    depends_on:
      oficial-backend:
        condition: service_healthy