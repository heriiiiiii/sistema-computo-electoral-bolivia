version: "3.8"

# =============================================================================
#  Module 03 — Official Count Flow
#
#  Requires module 01 (clusters) to be running first.
#  Connects to the PostgreSQL router from module 01 via shared Docker network.
# =============================================================================

networks:
  oep-network:
    external: true
    name: 01-clusters-bases-failover_oep-network

services:

  # ── Official Count Backend (NestJS) ─────────────────────────────────────────
  oficial-backend:
    build: ./backend
    container_name: oficial-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://oep_user:oep_password@postgres-router:5432/oep_oficial
      PORT: "4000"
      NODE_ENV: production
    ports:
      - "4000:4000"
    networks:
      - oep-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/oficial/resumen || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── CSV Automation (runs once) ───────────────────────────────────────────────
  csv-automation:
    build: ./automation
    container_name: csv-automation
    restart: "no"
    environment:
      BACKEND_URL: http://oficial-backend:4000/api
      CSV_DIR: /app/cvs
      CHUNK_SIZE: "200"
      USUARIO_CARGA: automation
      IP_ORIGEN: automation-container
    volumes:
      - ./cvs:/app/cvs:ro
    networks:
      - oep-network
    depends_on:
      oficial-backend:
        condition: service_healthy