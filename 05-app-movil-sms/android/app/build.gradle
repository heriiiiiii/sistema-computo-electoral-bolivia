plugins {
    id "com.android.application"
    id "kotlin-android"
    // Plugin que conecta Flutter con el sistema de build de Android
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.actaelectoral"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.example.actaelectoral"
        // image_picker requiere minSdk 21 como mínimo
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // Usar firma de debug para builds de prueba; cambiar en producción
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
}

flutter {
    source "../.."
}
